name: compose build and up
description: Runs docker-compose up and waits for stuff to start properly

inputs:
  application-name:
    required: true
    type: string
  cache-ref:
    description: |
      Registry ref used as the BuildKit cache backend, e.g.
      registry.stage.miceportal.makandra.cloud/myapp:buildcache
      When empty, builds run without a cache backend (previous behaviour).
    required: false
    default: ''
  cache-push:
    description: Whether to export the build cache (cache_to). Set false on PR builds to read cache without writing it.
    required: false
    default: 'true'
  build-secrets:
    description: |
      Whether to pass the credentials the calling workflow set up (SSH_AUTH_SOCK and
      SIDEKIQ_ENTERPRISE_CREDENTIALS) into the build of the app image.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
  - shell: bash
    run: |
      echo "::group::>>> Pull dependencies"
      docker compose -f docker-compose.test.yml pull --ignore-pull-failures 2>&1 | grep -v -E '^Pulling .*\.\. (extracting |downloading |waiting|pulling fs |verifying checksum|download complete)'
      echo "::endgroup::"

  - name: Set up buildx builder
    if: ${{ inputs.cache-ref != '' || inputs.build-secrets == 'true' }}
    shell: bash
    run: |
      echo "::group::>>> Set up buildx"
      # The docker-container driver is required for registry cache export;
      # the default "docker" driver does not support --cache-to. Builds with
      # credentials use it too, so they take the same path with or without a cache.
      docker buildx inspect ci-builder >/dev/null 2>&1 \
        || docker buildx create --name ci-builder --driver docker-container --use
      docker buildx use ci-builder
      docker buildx inspect --bootstrap
      echo "::endgroup::"

  - name: Build images
    shell: bash
    env:
      CACHE_REF: ${{ inputs.cache-ref }}
      CACHE_PUSH: ${{ inputs.cache-push }}
      APP_NAME: ${{ inputs.application-name }}
      BUILD_SECRETS: ${{ inputs.build-secrets }}
    run: |
      echo "::group::>>> Build"
      if [ -z "$CACHE_REF" ] && [ "$BUILD_SECRETS" != "true" ]; then
        # No cache backend and no credentials: plain compose build against the
        # local image store, matching the previous implicit build inside `up`.
        docker compose -f docker-compose.test.yml build
      else
        # The app is built with buildx, which compose build cannot replace: it needs
        # the docker-container driver for the registry cache backend, and has no
        # flag for --secret. --load puts the result back into the local image store
        # so the subsequent `docker compose up` finds it.
        CACHE_ARGS=""
        if [ -n "$CACHE_REF" ]; then
          CACHE_ARGS="--cache-from type=registry,ref=${CACHE_REF}"
          if [ "$CACHE_PUSH" = "true" ]; then
            # mode=max exports intermediate stages too. This matters here: the
            # bundler and yarn layers live in the discarded `build` stage, so
            # mode=min (the default) would export nothing useful.
            CACHE_ARGS="$CACHE_ARGS --cache-to type=registry,ref=${CACHE_REF},mode=max"
          fi
        fi

        # Credentials for private gems, set up by the calling workflow. They are only
        # mounted into the RUN steps that ask for them and never end up in a layer.
        SECRET_ARGS=""
        if [ "$BUILD_SECRETS" = "true" ]; then
          if [ -n "$SSH_AUTH_SOCK" ]; then
            SECRET_ARGS="--ssh default"
          fi
          if [ -n "$SIDEKIQ_ENTERPRISE_CREDENTIALS" ]; then
            SECRET_ARGS="$SECRET_ARGS --secret id=sidekiq_enterprise,env=SIDEKIQ_ENTERPRISE_CREDENTIALS"
          fi
        fi

        CONFIG=$(docker compose -f docker-compose.test.yml config --format json)

        # Resolve context/dockerfile/image/target from compose, so we honour whatever
        # the application's compose file declares. Emits four tab-separated fields
        # and then one build arg per line on success, or "ERROR<TAB><reason>" for
        # a readable failure.
        EXTRACT=$(printf %s "$CONFIG" | ruby -rjson -e '
          s = (JSON.parse(STDIN.read)["services"] || {})[ENV["APP_NAME"]]
          fail_with = ->(reason) { puts "ERROR\t#{reason}"; exit 0 }
          fail_with.call("no service named %s" % ENV["APP_NAME"]) if s.nil?
          fail_with.call("service has no build: section, so there is nothing to build with cache-ref or build-secrets") if s["build"].nil?
          fail_with.call("service has no image: key; an explicit image name is required so the built image can be loaded back into the local store") if s["image"].to_s.empty?
          b = s["build"]
          puts [b["context"], b["dockerfile"] || "Dockerfile", s["image"], b["target"].to_s].join("\t")
          # Args without a value (null) are left to the Dockerfile default, as compose does
          (b["args"] || {}).each { |k, v| puts "#{k}=#{v}" unless v.nil? }
        ')

        if [ "$(printf %s "$EXTRACT" | head -n1 | cut -f1)" = "ERROR" ]; then
          echo "::error title=Cannot build ${APP_NAME}::$(printf %s "$EXTRACT" | cut -f2)"
          exit 1
        fi

        mapfile -t LINES <<< "$EXTRACT"
        IFS=$'\t' read -r CONTEXT DOCKERFILE IMAGE TARGET <<< "${LINES[0]}"
        TARGET_ARGS=()
        if [ -n "$TARGET" ]; then
          TARGET_ARGS=(--target "$TARGET")
        fi
        BUILD_ARGS=()
        for arg in "${LINES[@]:1}"; do
          BUILD_ARGS+=(--build-arg "$arg")
        done

        echo " --- building ${IMAGE} from ${CONTEXT}/${DOCKERFILE}"
        docker buildx build \
          --file "${CONTEXT}/${DOCKERFILE}" \
          --tag "${IMAGE}" \
          --load \
          "${TARGET_ARGS[@]}" \
          "${BUILD_ARGS[@]}" \
          $CACHE_ARGS \
          $SECRET_ARGS \
          "${CONTEXT}"

        # Any other services with a build section still build the classic way. The
        # app is left out: building it again would run without the credentials and
        # replace the image just loaded.
        OTHERS=$(printf %s "$CONFIG" | ruby -rjson -e '
          services = JSON.parse(STDIN.read)["services"] || {}
          puts services.select { |name, s| s["build"] && name != ENV["APP_NAME"] }.keys
        ')
        if [ -n "$OTHERS" ]; then
          docker compose -f docker-compose.test.yml build $OTHERS
        fi
      fi
      echo "::endgroup::"

  - shell: bash
    run: |
      echo "::group::>>> docker compose up"
      docker compose -f docker-compose.test.yml up -d
      echo "::endgroup::"

  - shell: bash
    run: |
      echo "::group::>>> prepare database"
      status=0
      docker compose -f docker-compose.test.yml exec -T ${{ inputs.application-name }} bin/rails db:drop db:create db:test:prepare || status=$?
      echo "::endgroup::"
      if [ $status -ne 0 ]; then
        echo "::error title=prepare database failed::exit code ${status}; see the container logs dumped at the end of this job"
        exit $status
      fi

  - shell: bash
    run: |
      echo "::group::>>> Wait while starting"
      sleep 5
      tries=20
      while :; do
        tries=$(( tries - 1 ))
        SERVICES=$(docker compose -f docker-compose.test.yml ps)
        if echo $SERVICES | grep -q '(health: starting)'
        then
          echo " -- Still waiting ($tries more) ..."
          echo
          echo "$SERVICES" | grep '(health: starting)'
          if [[ $tries -lt 0 ]]; then
            echo "Too many retries. Giving up."
            echo "::error title=Starting timed out::Some services are still starting. Too many retries."
            exit 1
          fi
          sleep 2
        else
          echo " -- No more starting services..."
          echo "$SERVICES"
          break
        fi
      done
      echo "::endgroup::"

  - shell: bash
    run: |
      echo "::group::>>> Count started services"
      n=$(ruby -e "require 'yaml'; print YAML.safe_load(File.read('docker-compose.test.yml'))['services'].count")
      echo " --- Checking if all ${n} services are running..."
      RUNNING=$(docker compose -f docker-compose.test.yml ps --services --filter "status=running" | wc -l)
      if [ "$RUNNING" != "$n" ]; then
        echo "  -- not all services are running"
        echo "::error title=Starting failed::Not all expected services are running"
        exit 1
      fi
      echo "::endgroup::"

  - shell: bash
    run: |
      echo "::group::>>> Check if app is healthy"
      STATUS=$(docker inspect --format "{{.State.Health.Status}}" $(docker compose -f docker-compose.test.yml ps -q ${{ inputs.application-name}}))
      if [ "$STATUS" != "healthy" ]
      then
        echo "${{ inputs.application-name }} is not healthy:"
        echo "::error title=Not healthy::The app is not in healthy status: ${STATUS}"
        docker compose -f docker-compose.test.yml ps
        exit 1
      fi
      echo "::endgroup::"

  - name: Dump container logs on failure
    if: failure()
    shell: bash
    run: |
      echo "::group::>>> docker compose ps"
      docker compose -f docker-compose.test.yml ps -a
      echo "::endgroup::"
      echo ">>> docker compose logs"
      docker compose -f docker-compose.test.yml logs --no-color --tail 300
