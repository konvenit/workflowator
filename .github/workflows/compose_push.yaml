name: docker compose build and push to docker hub

on:
  workflow_call:
    inputs:
      application-name:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: ${{ github.event.pull_request.head.sha || github.sha }}
      push_to_docker_hub:
        required: false
        default: true
        type: boolean
      cache_ref:
        description: Registry ref for the BuildKit cache backend. Empty disables build caching.
        required: false
        default: ''
        type: string
      cache_push:
        description: Whether to export the build cache (cache_to). Set false on PR builds to read the cache without overwriting it.
        required: false
        default: true
        type: boolean

    secrets:
      nexus_user:
        required: true
      nexus_pass:
        required: true
      makandra_registry_user:
        required: true
      makandra_registry_pass:
        required: true
      private_repo_private_key:
        description: Private SSH key for git@github.com gems, passed into the build with RUN --mount=type=ssh
        required: false
      sidekiq_enterprise_credentials:
        description: user:password for enterprise.contribsys.com, passed into the build with RUN --mount=type=secret,id=sidekiq_enterprise
        required: false

env:
  TAG: ${{ inputs.tag }}
  SIDEKIQ_ENTERPRISE_CREDENTIALS: ${{ secrets.sidekiq_enterprise_credentials }}

jobs:
  compose_push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
    - name: Setup Makandra Registry Access
      run: |
        docker login registry.stage.miceportal.makandra.cloud -u ${{ secrets.makandra_registry_user }} -p ${{ secrets.makandra_registry_pass }}
    - name: Start ssh-agent for private gems
      env:
        PRIVATE_REPO_PRIVATE_KEY: ${{ secrets.private_repo_private_key }}
      run: |
        if [ -z "$PRIVATE_REPO_PRIVATE_KEY" ]; then
          echo "no private_repo_private_key secret, building without ssh-agent"
          exit 0
        fi
        eval "$(ssh-agent -s)"
        ssh-add - <<< "$PRIVATE_REPO_PRIVATE_KEY"
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
        echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
    - name: Compose up
      uses: konvenit/workflowator/.github/actions/compose@v23-slim
      with:
        application-name: ${{ inputs.application-name }}
        cache-ref: ${{ inputs.cache_ref }}
        cache-push: ${{ inputs.cache_push }}
    - name: Push Docker image to Makandra Registry
      if: ${{ inputs.push_to_docker_hub }}
      run: |
        docker tag $(docker compose -f docker-compose.test.yml images ${{ inputs.application-name}} -q) registry.stage.miceportal.makandra.cloud/${{ inputs.application-name}}:${{ inputs.tag }}
        docker push registry.stage.miceportal.makandra.cloud/${{ inputs.application-name}}:${{ inputs.tag }}
    - name: Stop containers
      if: always()
      run: docker compose -f docker-compose.test.yml down
