name: docker compose build and push to docker hub

on:
  workflow_call:
    inputs:
      application-name:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: ${{ github.event.pull_request.head.sha || github.sha }}
      push_to_docker_hub:
        required: false
        default: true
        type: boolean
      cache_ref:
        description: Registry ref for the BuildKit cache backend. Empty disables build caching.
        required: false
        default: ''
        type: string

    secrets:
      nexus_user:
        required: true
      nexus_pass:
        required: true
      makandra_registry_user:
        required: true
      makandra_registry_pass:
        required: true

env:
  TAG: ${{ inputs.tag }}

jobs:
  compose_push:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
    - name: Setup Makandra Registry Access
      run: |
        docker login registry.stage.miceportal.makandra.cloud -u ${{ secrets.makandra_registry_user }} -p ${{ secrets.makandra_registry_pass }}
    - name: Compose up
      uses: konvenit/workflowator/.github/actions/compose@mp53348_cache_bundler_and_npm
      with:
        application-name: ${{ inputs.application-name }}
        cache-ref: ${{ inputs.cache_ref }}
        cache-push: 'true'
    - name: Push Docker image to Makandra Registry
      if: ${{ inputs.push_to_docker_hub }}
      run: |
        docker tag $(docker compose -f docker-compose.test.yml images ${{ inputs.application-name}} -q) registry.stage.miceportal.makandra.cloud/${{ inputs.application-name}}:${{ inputs.tag }}
        docker push registry.stage.miceportal.makandra.cloud/${{ inputs.application-name}}:${{ inputs.tag }}
    - name: Stop containers
      if: always()
      run: docker compose -f docker-compose.test.yml down
