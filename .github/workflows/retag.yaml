name: retag an image in the Makandra registry

# Points a second tag at an image compose_push already pushed, e.g. a moving
# :latest for an app that staging boxes run from master. It republishes the
# manifest instead of building again, so both tags name the same digest.

on:
  workflow_call:
    inputs:
      application-name:
        required: true
        type: string
      source_tag:
        required: false
        type: string
        default: ${{ github.event.pull_request.head.sha || github.sha }}
      tag:
        required: true
        type: string

    secrets:
      makandra_registry_user:
        required: true
      makandra_registry_pass:
        required: true

env:
  IMAGE: registry.stage.miceportal.makandra.cloud/${{ inputs.application-name }}

jobs:
  retag:
    runs-on: ubuntu-latest

    steps:
    - name: Setup Makandra Registry Access
      run: |
        echo "${{ secrets.makandra_registry_pass }}" | docker login registry.stage.miceportal.makandra.cloud -u ${{ secrets.makandra_registry_user }} --password-stdin

    - name: Point the tag at the source image
      run: |
        docker buildx imagetools create -t $IMAGE:${{ inputs.tag }} $IMAGE:${{ inputs.source_tag }}
