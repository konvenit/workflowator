name: docker compose build and run

on:
  workflow_call:
    inputs:
      application-name:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: ${{ github.event.pull_request.head.sha || github.sha }}
      code_coverage:
        required: false
        type: boolean
        default: false
      algolia_index:
        required: false
        type: string
        default: null
      artifacts_path:
        required: false
        type: string
        default: null
      cmd:
        required: true
        type: string
      cache_ref:
        description: Registry ref for the BuildKit cache backend. Empty disables build caching.
        required: false
        default: ''
        type: string
      build_secrets:
        description: Pass private_repo_private_key and sidekiq_enterprise_credentials into the image build. Off by default; when on, at least one of them must be set.
        required: false
        default: false
        type: boolean
    secrets:
      nexus_user:
        required: true
      nexus_pass:
        required: true
      makandra_registry_user:
        required: true
      makandra_registry_pass:
        required: true
      private_repo_private_key:
        description: Private SSH key for git@github.com gems. With build_secrets on, passed into the build with RUN --mount=type=ssh
        required: false
      sidekiq_enterprise_credentials:
        description: user:password for enterprise.contribsys.com. With build_secrets on, passed into the build with RUN --mount=type=secret,id=sidekiq_enterprise
        required: false
env:
  TAG: ${{ inputs.tag }}
  SIDEKIQ_ENTERPRISE_CREDENTIALS: ${{ inputs.build_secrets && secrets.sidekiq_enterprise_credentials || '' }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  # See https://github.com/actions/runner/issues/409 - there is still no conditional operator
  ALGOLIA_SUPPLIERS_INDEX_NAME: ${{ inputs.algolia_index && format('ci_{0}_{1}_{2}_supps', inputs.tag, github.run_number, inputs.algolia_index) || '' }}
  ALGOLIA_MOMENTS_INDEX_NAME:   ${{ inputs.algolia_index && format('ci_{0}_{1}_{2}_momes', inputs.tag, github.run_number, inputs.algolia_index) || '' }}
  ALGOLIA_APPLICATION:    ${{ inputs.algolia_index && secrets.ALGOLIA_APPLICATION    || '' }}
  ALGOLIA_SEARCH_API_KEY: ${{ inputs.algolia_index && secrets.ALGOLIA_SEARCH_API_KEY || '' }}
  ALGOLIA_WRITE_API_KEY:  ${{ inputs.algolia_index && secrets.ALGOLIA_WRITE_API_KEY  || '' }}

jobs:
  compose_run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1

    - name: Setup Makandra Registry Access
      run: |
        docker login registry.stage.miceportal.makandra.cloud -u ${{ secrets.makandra_registry_user }} -p ${{ secrets.makandra_registry_pass }}

    - name: Set up build secrets
      if: ${{ inputs.build_secrets }}
      env:
        PRIVATE_REPO_PRIVATE_KEY: ${{ secrets.private_repo_private_key }}
      run: |
        if [ -z "$PRIVATE_REPO_PRIVATE_KEY" ] && [ -z "$SIDEKIQ_ENTERPRISE_CREDENTIALS" ]; then
          echo "::error title=No build secrets::build_secrets is on, but neither private_repo_private_key nor sidekiq_enterprise_credentials is passed. Pass them under secrets: in the calling workflow. Dependabot PRs only see Dependabot secrets."
          exit 1
        fi
        if [ -n "$PRIVATE_REPO_PRIVATE_KEY" ]; then
          echo "passing private_repo_private_key into the build with --ssh default"
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$PRIVATE_REPO_PRIVATE_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
        fi
        if [ -n "$SIDEKIQ_ENTERPRISE_CREDENTIALS" ]; then
          echo "passing sidekiq_enterprise_credentials into the build with --secret id=sidekiq_enterprise"
        fi

    - name: Compose up
      uses: konvenit/workflowator/.github/actions/compose@v24
      with:
        application-name: ${{ inputs.application-name }}
        cache-ref: ${{ inputs.cache_ref }}
        # Test runs read the cache but do not export it, so they cannot
        # overwrite the cache produced by the push workflow.
        cache-push: 'false'
        build-secrets: ${{ inputs.build_secrets }}

    - name: Create Algolia index
      if: ${{ inputs.algolia_index }}
      run: |
        docker compose -f docker-compose.test.yml exec -T ${{ inputs.application-name }} bundle exec rake algolia:create:all

    - name: Run command
      if: ${{ !inputs.code_coverage }}
      run: |
        docker compose -f docker-compose.test.yml exec -T ${{ inputs.application-name }} ${{ inputs.cmd}}

    - name: Run command with code coverage
      if: ${{ inputs.code_coverage }}
      run: |
        # Could we download that file, review it, and then use that - approved by us - local copy?
        ci_env=`bash <(curl -s https://codecov.io/env)`
        docker compose -f docker-compose.test.yml exec -T -e CI=true -e CODECOVERAGE=true $ci_env ${{ inputs.application-name }} ${{ inputs.cmd}}

    - name: upload artifact
      # uploads only if run failed
      if: ${{ failure() && inputs.artifacts_path }}
      uses: actions/upload-artifact@v7
      with:
        name: upload artifacts
        path: ${{ inputs.artifacts_path }}

    - name: Remove Algolia index (flaky!)
      if: inputs.algolia_index && always()
      run: |
        docker compose -f docker-compose.test.yml exec -T ${{ inputs.application-name }} bundle exec rake algolia:remove:all || true

    - name: Stop containers
      if: always()
      run: docker compose -f docker-compose.test.yml down
